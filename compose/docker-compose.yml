services:

  frontend:
    build: ../apps/frontend
    container_name: frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

  backend:
    build: ../apps/backend
    container_name: backend

    ports:
      - "8000:8000"

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend
